name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'chio-v*'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check -L

      - name: Check dev shell
        run: nix develop --command ./gradlew --version

      - name: Build and test
        run: nix build -L

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-26.04
    needs: [ build ]
    if: startsWith(github.ref, 'refs/tags/chio-v')
    timeout-minutes: 30
    environment:
      name: maven
      url: https://central.sonatype.com/artifact/io.github.7mochi/chio
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Stage artifacts
        run: nix develop --command ./gradlew nmcpZipAggregation --no-daemon
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}

      - name: Publish to Maven Central
        run: nix develop --command ./gradlew nmcpPublishAggregationToCentralPortal --no-daemon
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
